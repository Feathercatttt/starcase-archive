<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#302937"><title>星匣 · 创作档案</title><style>/* APP_CSS */</style></head>
<body>
<div class="app-shell">
 <aside class="shelf" aria-label="主导航"><a href="#ideas" class="brand" aria-label="星匣首页"><span class="brand-symbol" data-icon="archive"></span><span><b>星匣</b><small>把未成形的世界，慢慢收好</small></span></a><nav id="desktopNav"></nav><div class="shelf-note"><span data-icon="bookmark"></span><p>你的设定，不必一次写完。<br>留一个位置，下一次再接着想。</p></div><button class="shelf-settings" data-action="settings"><span data-icon="settings"></span>设置与资料互通<span id="saveDot" class="save-dot" title="本机保存状态"></span></button></aside>
 <main class="workspace">
  <header class="workspace-header"><div class="heading"><span class="section-glyph" id="areaGlyph"></span><div><p class="breadcrumb" id="breadcrumb">我的创作档案</p><h1 id="areaTitle">灵感盒</h1></div></div><div class="header-actions"><button class="quiet icon-mobile" data-action="settings" aria-label="设置与资料互通"><span data-icon="settings"></span></button><button class="primary" data-action="new"><span data-icon="plus"></span><span id="newLabel">新建条目</span></button></div></header>
  <div class="intro-line"><p id="areaSubtitle"></p><span id="saveLabel" role="status">正在打开资料…</span></div>
  <section class="capture" id="captureBox" aria-label="快速收纳灵感"><div class="capture-heading"><span data-icon="spark"></span><b>此刻想到了什么？</b><small>一句话也可以</small></div><label class="sr-only" for="captureText">灵感内容</label><textarea id="captureText" aria-label="灵感内容" rows="2" placeholder="一个奇怪的地点、一件不该存在的物品，或一句还没有下文的话…"></textarea><div class="capture-footer"><label><span class="sr-only">灵感标签</span><input id="captureTags" aria-label="灵感标签" placeholder="加个标签，用逗号分隔" maxlength="250"></label><label><span class="sr-only">适用系统</span><select id="captureSystem"><option value="any">通用灵感</option><option value="dnd">DND</option><option value="coc">COC</option></select></label><button class="primary" data-action="capture">收进匣子<span data-icon="arrow"></span></button></div></section>
  <div class="catalog-toolbar"><label class="search"><span data-icon="search"></span><input type="search" id="searchInput" aria-label="搜索标题、标签和正文" placeholder="搜索标题、标签和正文" autocomplete="off"><kbd>Ctrl K</kbd></label><label class="system-filter"><span class="sr-only">筛选系统</span><select id="systemFilter"><option value="all">所有系统</option><option value="dnd">DND</option><option value="coc">COC</option><option value="any">通用</option></select></label><label class="project-filter"><span class="sr-only">筛选世界或模组</span><select id="projectFilter"><option value="all">全部档案</option></select></label><button class="quiet favorite-filter" id="favoriteFilter" data-action="favorite-filter" aria-pressed="false" title="只看已收藏"><span data-icon="star"></span><span>收藏</span></button></div>
  <div class="filter-row" id="typeFilters" role="group" aria-label="条目类型"></div>
  <div class="reading-desk" id="readingDesk"><section class="catalog" aria-label="条目索引"><header class="catalog-heading"><span id="resultCount"></span><button class="text-button" data-action="clear-search" id="clearSearch" hidden>清除筛选</button></header><div id="entryList"></div><div class="catalog-bottom">保存在你的设备里，随时可以带走。</div></section><article class="reader" id="reader" aria-label="条目正文"><div class="reader-empty">正在打开创作档案…</div></article></div>
 </main>
</div>
<nav class="mobile-nav" id="mobileNav" aria-label="底部导航"></nav>
<dialog id="editorDialog" class="editor-dialog" aria-labelledby="editorHeading"><form id="editorForm" novalidate><header class="dialog-header"><div><p class="breadcrumb" id="editorType"></p><h2 id="editorHeading">编辑条目</h2></div><button type="button" class="icon-button" data-action="close-editor" aria-label="关闭编辑"><span data-icon="close"></span></button></header><div class="editor-body" id="editorBody"></div><footer class="dialog-footer"><p class="form-error" id="editorError" role="alert"></p><button type="button" class="quiet" data-action="close-editor">取消</button><button type="submit" class="primary">保存条目</button></footer></form></dialog>
<dialog id="utilityDialog" class="utility-dialog" aria-labelledby="utilityHeading"><header class="dialog-header"><h2 id="utilityHeading"></h2><button class="icon-button" data-action="close-utility" aria-label="关闭窗口"><span data-icon="close"></span></button></header><div class="utility-body" id="utilityBody"></div></dialog>
<input type="file" id="importFile" accept=".json,.starcase,.ndjson,.txt,application/json" hidden><input type="file" id="coverFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>/* APP_TEMPLATES */</script><script>/* APP_QR */</script><script>/* APP_JS */</script>
</body></html>
